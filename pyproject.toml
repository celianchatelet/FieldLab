[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldlab"
version = "0.2.0"
description = "Laboratoire pédagogique multiphysique 2D/3D interactif"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2.5",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PySide6>=6.6",
    "scikit-fem>=10.0",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "pillow>=10",
    "gmsh>=4.12",
    "meshio>=5.3",
]

[project.scripts]
fieldlab = "fieldlab.app.main_window:run"

[tool.setuptools.packages.find]
include = ["fieldlab*"]
